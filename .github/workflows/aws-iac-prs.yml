name: AWS IAC
run-name: FMT and PLAN IaC on feature branch
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
    paths:
      - 'core-env/**'
      - '.github/workflows/aws*'
permissions:
  id-token: write
  pull-requests: write
jobs:
  core_aws:
    outputs:
      plan: ${{ steps.plan_outcome.outputs.output }}
      fmt: ${{ steps.fmt_outcome.outputs.output }}
    defaults:
      run:
        working-directory: core-env/aws
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@main # Or a specific version
        with:
          role-to-assume: arn:aws:iam::218691292270:role/sedemo-iac-pipeline-role
          aws-region: us-west-2
      - name: Verify AWS identity
        run: |
          # Your commands that require AWS credentials
          aws sts get-caller-identity
      - name: Verify Tofu
        uses: opentofu/setup-opentofu@v1
      - name: OpenTofu fmt
        id: fmt
        shell: bash
        run: tofu fmt -check 2>&1 | tee /tmp/fmt.out
        continue-on-error: true
      - name: fmt output
        id: fmt_outcome
        run: echo "output=${{steps.fmt.outcome}}" >> "$GITHUB_OUTPUT"
      - run: tofu init -input=false
      # Exit code 2 from -detailed-exitcode means "changes present", not an error
      - id: plan
        shell: bash
        run: |
          set +e
          tofu plan -no-color -input=false -detailed-exitcode 2>&1 | tee /tmp/plan.out
          ec=${PIPESTATUS[0]}
          echo "exitcode=$ec" >> "$GITHUB_OUTPUT"
          [ "$ec" -eq 1 ] && exit 1 || exit 0
        continue-on-error: true
      - name: plan output
        id: plan_outcome
        run: echo "output=${{steps.plan.outcome}}" >> "$GITHUB_OUTPUT"
      - name: Upload plan
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: output-aws
          path: /tmp/*.out
      - name: Fail if fmt or plan failed
        if: steps.fmt.outcome == 'failure' || steps.plan.outcome == 'failure'
        run: exit 1
  eks_primary:
    needs: core_aws
    if: ${{ !cancelled() }}
    outputs:
      plan: ${{ steps.plan_outcome.outputs.output }}
      fmt: ${{ steps.fmt_outcome.outputs.output }}
    defaults:
      run:
        working-directory: core-env/eks-clusters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@main # Or a specific version
        with:
          role-to-assume: arn:aws:iam::218691292270:role/sedemo-iac-pipeline-role
          aws-region: us-west-2
      - name: Verify AWS identity
        run: |
          # Your commands that require AWS credentials
          aws sts get-caller-identity
      - name: Verify Tofu
        uses: opentofu/setup-opentofu@v1
      - name: OpenTofu fmt
        id: fmt
        shell: bash
        run: tofu fmt -check 2>&1 | tee /tmp/fmt.out
        continue-on-error: true
      - name: fmt output
        id: fmt_outcome
        run: echo "output=${{steps.fmt.outcome}}" >> "$GITHUB_OUTPUT"
      - run: tofu init -input=false
      # Exit code 2 from -detailed-exitcode means "changes present", not an error
      - id: plan
        shell: bash
        run: |
          set +e
          tofu plan -no-color -input=false -detailed-exitcode 2>&1 | tee /tmp/plan.out
          ec=${PIPESTATUS[0]}
          echo "exitcode=$ec" >> "$GITHUB_OUTPUT"
          [ "$ec" -eq 1 ] && exit 1 || exit 0
        continue-on-error: true
      - name: plan output
        id: plan_outcome
        run: echo "output=${{steps.plan.outcome}}" >> "$GITHUB_OUTPUT"
      - name: Upload plan
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: output-eks
          path: /tmp/*.out
      - name: Fail if fmt or plan failed
        if: steps.fmt.outcome == 'failure' || steps.plan.outcome == 'failure'
        run: exit 1
  pr_comment:
    needs:
      - eks_primary
      - core_aws
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
      # - name: Display structure of downloaded files
      #   run: |
      #     mkdir output-aws
      #     mkdir output-eks
      #     echo "this is file content" >> output-aws/plan.out
      #     echo "this is file content" >> output-eks/plan.out
      #     ls -R .
      - uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // 1. Retrieve existing bot comments for the PR
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })
            const botComment = comments.find(comment => {
              return comment.user.type === 'Bot' && comment.body.includes('OpenTofu Format and Style')
            })

            // 2. Prepare format of the comment
            const fs = require('fs');
            // Plans may be missing if a job failed early or was skipped, and PR
            // comments are capped at 65536 chars, so keep each plan well under half
            const MAX_PLAN = 30000;
            const readPlan = path => {
              if (!fs.existsSync(path)) return 'No plan output (job failed before plan or was skipped)';
              const plan = fs.readFileSync(path, 'utf8');
              return plan.length > MAX_PLAN
                ? plan.slice(0, MAX_PLAN) + '\n\n... truncated, see the workflow artifact for the full plan'
                : plan;
            };
            const awsCorePlan = readPlan('output-aws/plan.out');
            const eksPrimaryPlan = readPlan('output-eks/plan.out');
            const output = `
            ### AWS Core

            #### OpenTofu Format and Style 🖌\`${{ needs.core_aws.outputs.fmt }}\`

            #### OpenTofu Plan 📖 \`${{ needs.core_aws.outputs.plan }}\`

            <details><summary>Show Plan</summary>

            \`\`\`\n
            ${awsCorePlan}
            \`\`\`

            </details>

            ### EKS Primary Cluster
            #### OpenTofu Format and Style 🖌\`${{ needs.eks_primary.outputs.fmt }}\`

            #### OpenTofu Plan 📖 \`${{ needs.eks_primary.outputs.plan }}\`

            <details><summary>Show Plan</summary>

            \`\`\`\n
            ${eksPrimaryPlan}
            \`\`\`

            </details>

            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`, Workflow: \`${{ github.workflow }}\`*`;

            // 3. If we have a comment, update it, otherwise create a new one
            if (botComment) {
              github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: output
              })
            } else {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: output
              })
            }
