name: AWS IAC
run-name: APPLY iac to AWS environment (main) 🚀
on:
  push:
    branches:
      - main
    paths:
      - 'core-env/**'
      - '.github/workflows/aws*'
permissions:
  id-token: write
env:
  TWINGATE_SERVICE_KEY_SECRET_ID: sedemo/twingate-gha-service-key
jobs:
  core_aws:
    defaults:
      run:
        working-directory: core-env/aws
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@main # Or a specific version
        with:
          role-to-assume: arn:aws:iam::218691292270:role/sedemo-iac-pipeline-role
          aws-region: us-west-2
      - name: Verify AWS identity
        run: |
          # Your commands that require AWS credentials
          aws sts get-caller-identity
      - name: Verify Tofu
        uses: opentofu/setup-opentofu@v1
      - run: tofu init
      - id: apply
        run: tofu apply --auto-approve
  eks_primary:
    needs: core_aws
    defaults:
      run:
        working-directory: core-env/eks-clusters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@main # Or a specific version
        with:
          role-to-assume: arn:aws:iam::218691292270:role/sedemo-iac-pipeline-role
          aws-region: us-west-2
      - name: Verify AWS identity
        run: |
          # Your commands that require AWS credentials
          aws sts get-caller-identity
      # The EKS API is private; reach it through Twingate (sedemo-platform#183)
      - name: Fetch Twingate service key
        uses: aws-actions/aws-secretsmanager-get-secrets@v3
        with:
          secret-ids: |
            TWINGATE_SERVICE_KEY, ${{ env.TWINGATE_SERVICE_KEY_SECRET_ID }}
      - name: Connect to Twingate
        uses: twingate/github-action@v1
        with:
          service-key: ${{ env.TWINGATE_SERVICE_KEY }}
      - name: Clear Twingate service key from env
        run: echo "TWINGATE_SERVICE_KEY=" >> "$GITHUB_ENV"
      - name: Verify Tofu
        uses: opentofu/setup-opentofu@v1
      - run: tofu init
      - id: apply
        run: tofu apply --auto-approve